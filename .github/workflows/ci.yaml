name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
      - run: uv sync --locked
      - run: uv run pytest

  # 빌드·GHCR push·빌드 증명서는 homelab의 재사용 워크플로가 한다
  build:
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: June21621/homelab/.github/workflows/build-and-bump.yaml@main
    with:
      app: portfolio
      image: ghcr.io/june21621/portfolio
    secrets: inherit
