name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
      - run: uv sync --locked
      - run: uv run pytest

  # 빌드·GHCR push·빌드 증명서는 homelab의 재사용 워크플로가 한다
  build:
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    uses: June21621/homelab/.github/workflows/build-and-bump.yaml@main
    with:
      app: portfolio
      image: ghcr.io/june21621/portfolio
    # 태그 갱신 App 키는 repo가 아니라 environment `tag-bump`(배포 브랜치 main만)에 있다.
    # 재사용 워크플로는 호출 쪽이 inherit(또는 명시 전달)해야 environment 시크릿까지 읽을 수 있다.
    # repo 수준 시크릿은 두지 않으므로 inherit으로 넘어가는 것은 environment 시크릿뿐이고,
    # 그마저 environment를 지정한 main 빌드의 bump job에서만 값이 채워진다
    secrets: inherit
