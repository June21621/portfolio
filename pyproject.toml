[project]
name = "portfolio"
version = "0.1.0"
description = "homelab GitOps 파이프라인 확인용 포트폴리오 앱"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.150.0",
    "prometheus-client>=0.26.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv]
# 공개 후 2주가 지나지 않은 패키지 버전은 쓰지 않는다 (공급망 사고 대비)
exclude-newer = "2026-10-20T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx2>=2.15.1",
    "pytest>=9.1.1",
]
